<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Remote Desktop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=IBM+Plex+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <div id="home-view" class="home-view">
      <div class="auth-atmosphere" aria-hidden="true"></div>
      <main class="home-shell">
        <header class="home-header">
          <div>
            <p class="brand">Remote Desktop</p>
            <h1>Remote devices</h1>
            <p class="auth-sub">Select a computer and enter its PIN to connect.</p>
          </div>
          <a class="btn ghost" href="/admin">Admin</a>
        </header>
        <section id="host-list" class="host-list" aria-live="polite"></section>
        <p id="home-empty" class="home-empty" hidden>
          No computers yet. Open <a href="/admin">Admin</a> to add a host.
        </p>
      </main>
    </div>

    <div id="pin-view" class="auth-view" hidden>
      <div class="auth-atmosphere" aria-hidden="true"></div>
      <main class="auth-panel">
        <p class="brand">Remote Desktop</p>
        <h1 id="pin-host-name">Enter PIN</h1>
        <p class="auth-sub">Use the PIN set for this computer in Admin.</p>
        <form id="pin-form" class="auth-form" autocomplete="off">
          <label class="field">
            <span>PIN</span>
            <input
              id="pin-input"
              type="password"
              inputmode="numeric"
              maxlength="12"
              required
              autofocus
              placeholder="Access PIN"
            />
          </label>
          <p id="pin-error" class="auth-error" hidden></p>
          <div class="row-actions">
            <button type="button" class="btn ghost" id="pin-back-btn">Back</button>
            <button type="submit" class="btn primary" id="pin-connect-btn">Connect</button>
          </div>
        </form>
      </main>
    </div>

    <div id="session-view" class="session-view" hidden>
      <header class="session-bar">
        <div class="session-identity">
          <span class="live-dot" aria-hidden="true"></span>
          <div>
            <p class="session-brand">Remote Desktop</p>
            <h2 id="session-host-name">Connected host</h2>
          </div>
        </div>
        <div class="session-actions">
          <button type="button" class="btn ghost" id="fullscreen-btn">Fullscreen</button>
          <button type="button" class="btn danger" id="disconnect-btn">Disconnect</button>
        </div>
      </header>
      <div class="stage" id="stage">
        <canvas id="remote-canvas" hidden></canvas>
        <video id="remote-video" autoplay playsinline muted hidden></video>
        <div id="stage-overlay" class="stage-overlay">
          <p id="stage-message">Connecting…</p>
        </div>
      </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/client.js"></script>
  </body>
</html>
