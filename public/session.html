<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#3c4043" />
    <title>Remote Desktop Session</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=IBM+Plex+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body class="session-page">
    <div id="session-view" class="session-view crd-session">
      <header class="crd-toolbar" role="toolbar" aria-label="Remote controls">
        <div class="crd-toolbar-left">
          <button type="button" class="crd-icon-btn" id="menu-btn" title="Menu" aria-label="Menu" aria-expanded="false" aria-controls="session-menu">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
              <circle cx="12" cy="5" r="1.8" fill="currentColor" />
              <circle cx="12" cy="12" r="1.8" fill="currentColor" />
              <circle cx="12" cy="19" r="1.8" fill="currentColor" />
            </svg>
          </button>
          <div class="crd-host-chip">
            <span class="live-dot" aria-hidden="true"></span>
            <span id="session-host-name">Connecting…</span>
          </div>
        </div>
        <div class="crd-toolbar-center">
          <button type="button" class="crd-icon-btn" id="keyboard-btn" title="Keyboard" aria-label="Toggle keyboard" aria-pressed="false">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
              <rect x="2.5" y="6.5" width="19" height="11" rx="2" />
              <path d="M6 10h.01M9.5 10h.01M13 10h.01M16.5 10h.01M6 13.5h.01M9.5 13.5h.01M13 13.5h.01M16.5 13.5H18" />
            </svg>
          </button>
          <button type="button" class="crd-icon-btn" id="input-mode-btn" title="Touch mode" aria-label="Toggle touch or trackpad mode" aria-pressed="false">
            <svg id="input-mode-icon-touch" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
              <path d="M9 11.5V5.8a1.8 1.8 0 0 1 3.6 0V12" />
              <path d="M12.6 10.2V8.8a1.6 1.6 0 0 1 3.2 0V12" />
              <path d="M15.8 11.2v-.6a1.5 1.5 0 0 1 3 0v3.2c0 3.2-2.1 5.7-5.3 5.7h-1.2c-2.2 0-4.1-1-5.2-2.6L5 13.5a1.5 1.5 0 0 1 2.3-1.9l1.7 2" />
            </svg>
            <svg id="input-mode-icon-trackpad" class="is-hidden" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
              <rect x="4" y="4" width="16" height="16" rx="3" />
              <path d="M4 14h16M12 14v6" />
            </svg>
          </button>
          <button type="button" class="crd-icon-btn" id="fullscreen-btn" title="Fullscreen" aria-label="Toggle fullscreen">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
              <path d="M8 4H4v4M16 4h4v4M8 20H4v-4M16 20h4v-4" />
            </svg>
          </button>
        </div>
        <div class="crd-toolbar-right">
          <button type="button" class="btn danger crd-disconnect" id="disconnect-btn">Disconnect</button>
        </div>
        <div id="session-menu" class="crd-menu" hidden>
          <button type="button" class="crd-menu-item" id="menu-home-btn">Back to devices</button>
          <button type="button" class="crd-menu-item" id="menu-fullscreen-btn">Fullscreen</button>
          <button type="button" class="crd-menu-item danger" id="menu-disconnect-btn">Disconnect</button>
        </div>
      </header>

      <div class="stage" id="stage" tabindex="0">
        <canvas id="remote-canvas" hidden></canvas>
        <video id="remote-video" autoplay playsinline muted hidden></video>
        <div id="stage-overlay" class="stage-overlay">
          <p id="stage-message">Connecting…</p>
        </div>
      </div>

      <div id="osk" class="osk" hidden>
        <div class="osk-row" data-keys='["Esc","Tab","Backspace"]'></div>
        <div class="osk-row" data-keys='["1","2","3","4","5","6","7","8","9","0"]'></div>
        <div class="osk-row" data-keys='["q","w","e","r","t","y","u","i","o","p"]'></div>
        <div class="osk-row" data-keys='["a","s","d","f","g","h","j","k","l"]'></div>
        <div class="osk-row" data-keys='["Shift","z","x","c","v","b","n","m"]'></div>
        <div class="osk-row" data-keys='[",",".","/","Space","Enter"]'></div>
      </div>

      <form id="send-text-form" class="crd-send-text" autocomplete="off">
        <button type="button" class="crd-icon-btn send-text-key" id="send-text-keyboard-btn" title="Keyboard" aria-label="Toggle keyboard">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
            <rect x="2.5" y="6.5" width="19" height="11" rx="2" />
            <path d="M6 10h.01M9.5 10h.01M13 10h.01M16.5 10h.01M6 13.5h.01M9.5 13.5h.01M13 13.5h.01M16.5 13.5H18" />
          </svg>
        </button>
        <input
          id="send-text-input"
          type="text"
          enterkeyhint="send"
          placeholder="Send text"
          aria-label="Send text to remote computer"
        />
        <button type="submit" class="crd-icon-btn send-text-go" title="Send" aria-label="Send text">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <path d="M4 12h14M13 6l6 6-6 6" />
          </svg>
        </button>
      </form>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/session.js"></script>
  </body>
</html>
