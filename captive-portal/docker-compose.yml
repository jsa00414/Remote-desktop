services:
  portal:
    build: .
    container_name: guest-portal
    restart: unless-stopped
    ports:
      - "5050:5050"
    volumes:
      - ./users.json:/app/users.json:ro

  radius:
    build: ./radius
    container_name: guest-radius
    restart: unless-stopped
    ports:
      - "1812:1812/udp"
      - "1813:1813/udp"
