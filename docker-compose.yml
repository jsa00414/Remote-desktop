services:
  remote-desktop:
    build: .
    container_name: remote-desktop
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: "5000"
      SKIP_LOCAL_HOST: "1"
      ADMIN_PASSWORD: "8112026"
      DATA_DIR: /app/data
    volumes:
      - remote-desktop-data:/app/data

volumes:
  remote-desktop-data:
